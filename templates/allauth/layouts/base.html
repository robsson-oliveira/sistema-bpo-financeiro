{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block head_title %}{% endblock head_title %} — FinFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    {% block extra_head %}{% endblock extra_head %}
</head>
<body>
    {% include "partials/cabecalho.html" %}
    <main class="auth-pagina">
        {% include "partials/mensagens.html" %}
        <div class="auth-cartao">
            {% block content %}{% endblock content %}
        </div>
    </main>
    {% block extra_body %}{% endblock extra_body %}
</body>
</html>
